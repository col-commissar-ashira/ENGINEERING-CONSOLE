# DRAFT - NOT TESTED, NOT READY TO PUBLISH. Needs flatpak-builder on a machine with network access.
# Things that must be filled in/verified before it can build:
#   1. runtime-version / base-version: check what Flathub offers:  flatpak remote-ls flathub --runtime | grep -i "org.kde.Platform"
#   2. base: the Qt-for-Python (PySide6) base app on Flathub - confirm its exact id and that it matches the runtime.
#   3. psutil module: generate with  flatpak-pip-generator psutil  and add it to `modules` below.
# Sandbox caveats: the process monitor only sees sandboxed processes; nvidia-smi / lspci / parec may be missing inside
# the sandbox, so those metrics would show N/A. The .deb gives full telemetry.
app-id: org.engineeringconsole.EngineeringConsole
runtime: org.kde.Platform
runtime-version: 'FILL-IN'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: 'FILL-IN'
command: engineering-console
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network          # internet speed test only; nothing else uses the network
  - --socket=pulseaudio      # audio level meters
modules:
  # - python3-psutil.json    <- generated by flatpak-pip-generator
  - name: engineering-console
    buildsystem: simple
    build-commands:
      - install -d /app/lib/engineering-console
      - cp -r engineering_console /app/lib/engineering-console/
      - install -m644 main.py /app/lib/engineering-console/main.py
      - printf '#!/bin/sh\nCONSOLE_DESKTOP_ID=org.engineeringconsole.EngineeringConsole exec python3 /app/lib/engineering-console/main.py "$@"\n' > /app/bin/engineering-console
      - chmod +x /app/bin/engineering-console
      - install -Dm644 packaging/engineering-console.desktop /app/share/applications/org.engineeringconsole.EngineeringConsole.desktop
      - sed -i 's/^Icon=.*/Icon=org.engineeringconsole.EngineeringConsole/' /app/share/applications/org.engineeringconsole.EngineeringConsole.desktop
      - install -Dm644 engineering_console/icon.svg /app/share/icons/hicolor/scalable/apps/org.engineeringconsole.EngineeringConsole.svg
      - install -Dm644 packaging/org.engineeringconsole.EngineeringConsole.metainfo.xml /app/share/metainfo/org.engineeringconsole.EngineeringConsole.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/engineering-console/LICENSE
      - install -Dm644 NOTICE /app/share/licenses/engineering-console/NOTICE
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/licenses/engineering-console/THIRD_PARTY_NOTICES.md
    sources:
      - type: dir
        path: ../..
