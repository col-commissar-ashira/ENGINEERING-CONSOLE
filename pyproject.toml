[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-console"
version = "3.0.1"
description = "Spaceship-style hardware monitoring console for Linux, Windows and macOS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ashira Resevic", email = "ashiraresevic@proton.me" }]
maintainers = [{ name = "Ashira Resevic", email = "ashiraresevic@proton.me" }]
keywords = ["hardware monitor", "gpu", "sensors", "dashboard"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: System :: Monitoring",
]
dependencies = ["PySide6>=6.6,<7", "psutil>=5.9"]

[project.gui-scripts]
engineering-console = "engineering_console.app:main"

[tool.setuptools]
packages = ["engineering_console", "engineering_console.skins"]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
engineering_console = ["icon.svg"]
